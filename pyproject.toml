[project]
name = "phitsanulok-tourism"
version = "0.1.0"
description = "เว็บแอปพลิเคชันวิเคราะห์ Pain Point การท่องเที่ยวพิษณุโลก"
requires-python = ">=3.12"
dependencies = [
    # Phase 1 — Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "geoalchemy2",
    "alembic",
    "psycopg2-binary",
    "python-dotenv",
    # Phase 2 — Scraper
    "playwright",
    "selenium",
    "undetected-chromedriver",
    # Phase 3 — NLP
    "pythainlp>=5.0",
    "transformers",
    "torch",
    "anthropic>=0.40",
    # Phase 4 — FastAPI
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic>=2.0",
    # Phase 5 — Scheduler
    "apscheduler>=3.10",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["db", "api", "scraper", "nlp", "scheduler"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
